name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Version bump check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check version bump
        run: |
          set -euo pipefail

          pr_version=$(node -p "require('./package.json').version")
          echo "PR version: ${pr_version}"

          # Fetch base branch version via GitHub API to avoid full checkout
          base_version=$(curl -sSf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/contents/package.json?ref=${{ github.base_ref }}" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "")

          if [ -z "${base_version}" ]; then
            echo "WARNING: Could not determine base version from ${{ github.base_ref }}. Skipping check."
            exit 0
          fi

          echo "Base version: ${base_version}"

          compare_versions() {
            node -e "
              const [a, b] = ['$1', '$2'].map(v => v.split('.').map(Number));
              const len = Math.max(a.length, b.length);
              for (let i = 0; i < len; i++) {
                const av = a[i] ?? 0, bv = b[i] ?? 0;
                if (av > bv) { process.exit(1); return; }
                if (av < bv) { process.exit(2); return; }
              }
              process.exit(0);
            "
          }

          compare_versions "${pr_version}" "${base_version}" || cmp_code=$?
          case ${cmp_code:-0} in
            1) echo "Version bump OK: ${pr_version} > ${base_version}" ;;
            2) echo "ERROR: Version went backwards! PR version ${pr_version} < base version ${base_version}."; exit 1 ;;
            0) echo "ERROR: Version must be bumped. PR version ${pr_version} is the same as base version ${base_version}."; exit 1 ;;
            *) echo "ERROR: Unexpected comparison result."; exit 1 ;;
          esac

      - name: Check plugin version sync
        run: |
          set -euo pipefail

          pkg_version=$(node -p "require('./package.json').version")
          plugin_version=$(node -p "require('./claude-code-plugin/claude-status-dashboard/.claude-plugin/plugin.json').version")

          echo "package.json version: ${pkg_version}"
          echo "plugin.json version:   ${plugin_version}"

          if [ "${pkg_version}" != "${plugin_version}" ]; then
            echo "ERROR: plugin.json version (${plugin_version}) must match package.json version (${pkg_version})."
            exit 1
          fi
          echo "Plugin version sync OK."

  test:
    name: Type check and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run --reporter=verbose --reporter=junit --outputFile=test-results.xml

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@4a2e97665d5fa767581ef38eca97b9694bd4eef4
        with:
          name: Vitest results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Comment test summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const xml = fs.readFileSync('test-results.xml', 'utf8');
            const passed = (xml.match(/failures="0"/g) || []).length;
            const failed = (xml.match(/failures="[1-9]/g) || []).length;
            const total = (xml.match(/tests="/g) || []).length;
            const summary = failed > 0
              ? `**Tests**: ${total} total, ${failed} failing`
              : `**Tests**: ${total} passed`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c =>
              c.body.includes('## Test Results')
            );
            const body = `## Test Results\n\n${summary}\n\n_Updated at ${new Date().toISOString()}_`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: E2E tests
        run: npm run test:e2e
