services:
  dashboard:
    build: .
    container_name: claude-status-dashboard
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      RED_ALERT_AFTER_MS: "300000"
      USAGE_CACHE_TTL_MS: "30000"
      CLAUDE_CONFIG_DIR: "/claude"
      DATA_DIR: "/data"
      SESSION_TTL_MS: "604800000"
      # ---- Webhook notifications ----
      NOTIFY_WEBHOOK_URL: "https://api.pushover.net/1/messages.json"
      NOTIFY_FORMAT: "pushover"
      NOTIFY_ON: "idle"                        # ping when Claude is waiting for input
      NOTIFY_PUSHOVER_TOKEN: "your-app-token"  # create at https://pushover.net/apps/build
      NOTIFY_PUSHOVER_USER: "your-user-key"
      # NOTIFY_HEADERS: "{\"Authorization\":\"Bearer xxx\"}"  # extra HTTP headers (JSON)
    volumes:
      - "${HOME}/.claude:/claude:ro"
      - dashboard-data:/data
    restart: unless-stopped

volumes:
  dashboard-data:
