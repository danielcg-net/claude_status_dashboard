services:
  dashboard:
    build: .
    container_name: claude-status-dashboard
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      RED_ALERT_AFTER_MS: "300000"
      USAGE_CACHE_TTL_MS: "30000"
      CLAUDE_CONFIG_DIR: "/claude"
      DATA_DIR: "/data"
      SESSION_TTL_MS: "604800000"
      # ---- Webhook notifications (set values in .env, see .env.example) ----
      NOTIFY_WEBHOOK_URL: "${NOTIFY_WEBHOOK_URL}"
      NOTIFY_FORMAT: "${NOTIFY_FORMAT}"
      NOTIFY_ON: "${NOTIFY_ON}"
      NOTIFY_PUSHOVER_TOKEN: "${NOTIFY_PUSHOVER_TOKEN}"
      NOTIFY_PUSHOVER_USER: "${NOTIFY_PUSHOVER_USER}"
      NOTIFY_HEADERS: "${NOTIFY_HEADERS}"
    volumes:
      - "${HOME}/.claude:/claude:ro"
      - dashboard-data:/data
    restart: unless-stopped

volumes:
  dashboard-data:
