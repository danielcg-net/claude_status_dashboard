services:
  dashboard:
    build: .
    container_name: claude-status-dashboard
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      RED_ALERT_AFTER_MS: "300000"
      USAGE_CACHE_TTL_MS: "30000"
      CLAUDE_CONFIG_DIR: "/claude"
      DATA_DIR: "/data"
      SESSION_TTL_MS: "604800000"
      # ---- Webhook notifications (uncomment & configure) ----
      # NOTIFY_WEBHOOK_URL: "https://api.pushover.net/1/messages.json"
      # NOTIFY_FORMAT: "pushover"              # generic | pushover | teams | slack | discord
      # NOTIFY_ON: "started,finished,red"      # which events fire a notification
      # NOTIFY_PUSHOVER_TOKEN: "your-app-token"
      # NOTIFY_PUSHOVER_USER: "your-user-key"
      # NOTIFY_HEADERS: "{\"Authorization\":\"Bearer xxx\"}"  # extra HTTP headers (JSON)
    volumes:
      - "${HOME}/.claude:/claude:ro"
      - dashboard-data:/data
    restart: unless-stopped

volumes:
  dashboard-data:
