services:
  dashboard:
    build:
      context: .
      args:
        GIT_REF: "${GIT_REF:-main}"
    container_name: claude-status-dashboard
    # Run as the host user so files written to bind mounts (~/.claude,
    # ~/.claude-status-dashboard) are owned by the correct UID instead of root.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      HOME: "${HOME}"
      RED_ALERT_AFTER_MS: "300000"
      USAGE_CACHE_TTL_MS: "30000"
      CLAUDE_CONFIG_DIR: "/claude"
      DATA_DIR: "/data"
      SESSION_TTL_MS: "604800000"
      # Project-scope hook settings persist only when CLAUDE_PROJECT_CONFIG_DIR
      # points to a mounted volume. Uncomment and add a matching volume mount if
      # you install hooks at project scope and want them to survive restarts.
      # CLAUDE_PROJECT_CONFIG_DIR: "/project-claude"
      # ---- Webhook notifications (set values in .env, see .env.example) ----
      NOTIFY_WEBHOOK_URL: "${NOTIFY_WEBHOOK_URL}"
      NOTIFY_FORMAT: "${NOTIFY_FORMAT}"
      NOTIFY_ON: "${NOTIFY_ON}"
      NOTIFY_PUSHOVER_TOKEN: "${NOTIFY_PUSHOVER_TOKEN}"
      NOTIFY_PUSHOVER_USER: "${NOTIFY_PUSHOVER_USER}"
      NOTIFY_HEADERS: "${NOTIFY_HEADERS}"
    volumes:
      - "${HOME}/.claude:/claude"
      - "${HOME}/.claude-status-dashboard:${HOME}/.claude-status-dashboard"
      - dashboard-data:/data
    restart: unless-stopped

volumes:
  dashboard-data:
